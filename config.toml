base_url = "localhost"

title = "sol"
description = "description"
author = "Author"

default_language = "en"

taxonomies = [
    { name = "categories" },
    { name = "tags" }
]

build_search_index = false

generate_feeds = true
# feed_limit = 0
feed_filenames = ["atom.xml"]

output_dir = "public"
preserve_dotfiles_in_output = false
ignored_content = []
ignored_static = []
hard_link_static = false

minify_html = false
compile_sass = true

generate_sitemap = false
exclude_paginated_pages_in_sitemap = "none"

generate_robots_txt = true

[markdown]
definition_list = false

insert_anchor_links = "none"

external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
external_links_class = ""

bottom_footnotes = true

render_emoji = false
lazy_async_image = false
smart_punctuation = false

[markdown.highlighting]
style = "class"
theme = "catppuccin-latte"
error_on_missing_language = false
# Styles and the copy button read data-name and friends from <pre>
data_attr_position = "pre"

[link_checker]
skip_prefixes = [
    "http://[2001:db8::]/",
]
skip_anchor_prefixes = [
    "https://caniuse.com/",
]

internal_level = "error"
external_level = "error"

[slugify]
paths = "safe"
taxonomies = "on"
anchors = "on"
paths_keep_dates = false

[search]
index_format = "elasticlunr_javascript"

include_title = true
include_description = false
include_date = false
include_path = false
include_content = true

# truncate_content_length = 100

[translations]

[languages]

[extra]
timezone = "Europe/Berlin"

[extra.author]
name = "Author"
link = "https://wwww.example.com"

[extra.information]
name = "sol"
keywords = ["home"]

[[extra.parts]]
name = "blog"
path = "blog"
keywords = ["blog"]

[[extra.parts]]
name = "about"
path = "about"
keywords = ["about"]
